id: taxi_intro
namespace: deng.week5

inputs:
  - id: year
    type: INT
    defaults: 2024
  - id: month
    type: INT
    defaults: 1
    min: 1
    max: 12

tasks:
  - id: show_period
    type: io.kestra.plugin.core.log.Log
    message: "Selected taxi data: year={{ inputs.year }}, month={{ inputs.month }}"
